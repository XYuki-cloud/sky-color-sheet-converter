name: CI

on:
  push:
  pull_request:

jobs:
  desktop:
    name: Desktop converter
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-converter
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install core and development dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt
          python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest tests -q

      - name: Run player state-machine tests
        shell: pwsh
        run: node --test tests\player-core.test.mjs

      - name: Check JavaScript syntax
        shell: pwsh
        run: node --check player\player.js

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q scripts

  android:
    name: Android / ${{ matrix.project }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - midi-black
          - black-color
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: pwsh
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble debug APK
        shell: pwsh
        run: .\gradlew.bat :app:testDebugUnitTest :app:assembleDebug --no-daemon
